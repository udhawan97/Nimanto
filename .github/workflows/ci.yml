name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build the local beta
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Gitleaks scans the complete pushed range, which may span multiple commits.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting, types, and tests
        run: pnpm check
      - name: Build all source surfaces
        run: pnpm build
      - name: Install WebKit browser
        run: pnpm exec playwright install webkit
      - name: Run WebKit candidate journey
        run: pnpm exec playwright test --project=webkit
      - name: Smoke-test synthetic screenshot capture
        run: pnpm screenshots:check
      - name: Audit production and release-tool dependencies
        run: pnpm audit --audit-level high
      - name: Inventory production licenses
        run: pnpm licenses:check > /tmp/nimanto-production-licenses.json
      - name: Generate and validate the release SBOM shape
        run: pnpm sbom:check
      - name: Validate committed release inventories and checksums
        run: pnpm release:check
      - name: Scan the repository for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Build the self-hosted container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the digest-pinned local image
        run: |
          set -euo pipefail
          canary_value='NIMANTO_FICTIONAL_DOCKER_SECRET_CANARY'
          canary_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/nimanto-docker-canary.XXXXXX")"
          canary_container=''
          cleanup() {
            if [ -n "$canary_container" ]; then
              docker rm --force "$canary_container" >/dev/null 2>&1 || true
            fi
            rm -f -- .env.docker-canary
            rm -rf -- "$canary_dir"
          }
          trap cleanup EXIT
          printf '%s\n' "$canary_value" > .env.docker-canary
          docker build --tag nimanto:${{ github.sha }} .
          docker run --rm --entrypoint sh nimanto:${{ github.sha }} -c \
            "! grep -R -F '$canary_value' /app /data 2>/dev/null"

          canary_container="$(docker create nimanto:${{ github.sha }})"
          docker export --output "$canary_dir/final-filesystem.tar" "$canary_container"
          ! grep -a -q -F "$canary_value" "$canary_dir/final-filesystem.tar"
          docker rm "$canary_container" >/dev/null
          canary_container=''

          docker save --output "$canary_dir/saved-image.tar" nimanto:${{ github.sha }}
          mkdir "$canary_dir/saved-image"
          tar -xf "$canary_dir/saved-image.tar" -C "$canary_dir/saved-image"
          ! grep -a -q -F "$canary_value" "$canary_dir/saved-image.tar"
          ! grep -R -a -q -F "$canary_value" "$canary_dir/saved-image"
          mkdir "$canary_dir/saved-layers"
          layer_index=0
          while IFS= read -r -d '' archive_member; do
            if tar -tf "$archive_member" >/dev/null 2>&1; then
              layer_index=$((layer_index + 1))
              tar -xOf "$archive_member" > "$canary_dir/saved-layers/$layer_index.contents"
            fi
          done < <(find "$canary_dir/saved-image" -type f -print0)
          test "$layer_index" -gt 0
          ! grep -R -a -q -F "$canary_value" "$canary_dir/saved-layers"

          ! docker history --no-trunc nimanto:${{ github.sha }} | grep -F "$canary_value"
