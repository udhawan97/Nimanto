<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Nimanto">
  <defs>
    <radialGradient id="umber" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#241C14"/>
      <stop offset="1" stop-color="#0A0908"/>
    </radialGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8785F"/>
      <stop offset=".45" stop-color="#D6472C"/>
      <stop offset="1" stop-color="#D6472C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#umber)"/>
  <g transform="translate(72 72) scale(5.75)">
    <!-- the light, behind the screen -->
    <circle cx="23.4" cy="40.6" r="17" fill="url(#light)"/>
    <!-- card, pierced: evenodd turns the three diamonds into real holes so the
         light reads as coming through a jaali rather than painted on it -->
    <path fill="#D5CCB9" fill-rule="evenodd" d="M6 58 L58 58 L58 26.8 L37.2 6 L6 6 Z
      M17.85 32.65 l2.3 2.3 -2.3 2.3 -2.3 -2.3 Z
      M23.44 38.25 l2.3 2.3 -2.3 2.3 -2.3 -2.3 Z
      M29.04 43.85 l2.3 2.3 -2.3 2.3 -2.3 -2.3 Z"/>
    <path d="M11 53 L53 53 L53 28.9 L35.1 11 L11 11 Z" fill="none" stroke="#9D7C4A" stroke-width="1.4"/>
    <!-- the corner, turned back -->
    <path d="M58 26.8 L37.2 6 L37.2 26.8 Z" fill="#D6472C"/>
    <path d="M58 26.8 L37.2 6" stroke="#B8935A" stroke-width="1.3" fill="none"/>
  </g>
</svg>
