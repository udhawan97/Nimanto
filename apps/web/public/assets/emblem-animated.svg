<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 268" width="220" height="268" role="img" aria-label="Nimanto — the fold lotus: five brass-edged petals opening around an emerald seed">
  <title>Nimanto — the fold lotus</title>
  <!--
    The mark, opening once and settling, with the wordmark beneath it.

    Three things make this survive being rendered as an image on GitHub:

    1. Every keyTimes list runs 0 to 1. The petal stagger is encoded by holding
       a value until the petal's turn, not by starting the list late — a list
       that does not begin at 0 is invalid SMIL, and one invalid animation
       leaves its element stuck at its initial value.

    2. The markup's own state is the FINISHED state: each petal is written at
       its open angle and full opacity, and the animation rotates it back to
       closed and forward again. If SMIL is stripped or never runs, what remains
       is the correct static mark rather than an empty plate.

    3. The wordmark is outlines, not text. An SVG rendered as an image cannot
       fetch a webfont, so a <text> element would silently fall back to whatever
       serif the viewer happens to have. These paths are Instrument Serif,
       converted once from the font this project already self-hosts.

    The sequence is 4.4s with repeatCount="1", so nothing moves past the
    five-second threshold in WCAG 2.2.2 — a README offers no pause control.
  -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#241C14"/><stop offset="1" stop-color="#0A0908"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8785F"/>
      <stop offset=".4" stop-color="#D6472C" stop-opacity=".75"/>
      <stop offset="1" stop-color="#D6472C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="220" height="268" rx="44" fill="url(#ground)"/>

