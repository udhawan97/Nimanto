# cspell:ignore npmcli minimatch
packages:
  - apps/api
  - apps/web
  - apps/worker
  - packages/*

overrides:
  "undici@>=7.0.0 <7.30.1": 7.30.1
  "body-parser@>=2.0.0 <2.4.0": 2.4.0
  "nanoid@<3.3.18": 3.3.18
  "next>sharp": 0.35.5
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  "fast-uri@>=4.0.0 <4.2.3": 4.2.3
  # These consumers use public file-list APIs and matching
  # helpers. Keep the security upgrade scoped to the reviewed parent packages.
  "@fastify/static>glob": 14.0.2
  "@cyclonedx/cdxgen>glob": 14.0.2
  "@npmcli/package-json>glob": 14.0.2
  "@npmcli/map-workspaces>glob": 14.0.2
  "@npmcli/map-workspaces>minimatch": 11.0.1
  "shell-quote@>=1.8.4 <1.11.0": 1.11.0
  "compression@<1.8.2": 1.8.2

allowBuilds:
  "@next/swc-darwin-arm64": true
  "@next/swc-linux-x64-gnu": true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - "@next/swc-darwin-arm64"
  - "@next/swc-linux-x64-gnu"
  - esbuild
  - sharp
